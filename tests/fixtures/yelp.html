<!DOCTYPE html>
<html lang="en">
<head>
  <title>Acme Coffee - Yelp</title>
</head>
<body>
  <header>
    <div class="logo">Yelp</div>
  </header>

  <div class="review-list">
    <!-- Yelp Review 1 -->
    <div data-review-id="yelp_rev_201" class="review__09f24__card">
      <div class="user-passport-info">
        <a class="user-name" href="/user_details?userid=yelp_user_99">David Miller</a>
      </div>
      <div aria-label="5 star rating" class="five-stars">
        <span>5.0</span>
      </div>
      <span class="date__09f24">2026-08-10</span>
      <p class="comment__09f24">
        Best customer experience in town! The staff was incredibly welcoming and the ordering app made pickup seamless.
      </p>
    </div>

    <!-- Yelp Review 2: 1 star complaint -->
    <div data-review-id="yelp_rev_202" class="review__09f24__card">
      <div class="user-passport-info">
        <a class="user-name" href="/user_details?userid=yelp_user_100">Sarah Connor</a>
      </div>
      <div aria-label="1 star rating" class="one-star">
        <span>1.0</span>
      </div>
      <span class="date__09f24">2026-08-12</span>
      <p class="comment__09f24">
        Billed me twice for one transaction and the manager refused to refund. Unacceptable service and rude attitude.
      </p>
