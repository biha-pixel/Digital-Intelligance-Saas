version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Crawl4AI - Ethical Web Scraping Engine
  # ----------------------------------------------------------------------------
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: cxpulse-crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-local-dev-crawl4ai-token}
      - MAX_CONCURRENT_TASKS=5
      - PLAYWRIGHT_HEADLESS=true
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11235/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
